apiVersion: v1
kind: Pod
metadata: {name: ttb-suid-race}
spec:
  restartPolicy: Never
  hostPID: true
  containers:
  - name: poc
    image: quay.io/cilium/tetragon:v1.7.1
    imagePullPolicy: IfNotPresent
    command: ["/var/tmp/suidpoc"]
    securityContext: {runAsUser: 1000, privileged: true}
    volumeMounts:
    - {name: poc, mountPath: /var/tmp/suidpoc}
  volumes:
  - {name: poc, hostPath: {path: /var/tmp/suidpoc, type: File}}
