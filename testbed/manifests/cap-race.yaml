apiVersion: v1
kind: Pod
metadata:
  name: ttb-cap-race
spec:
  restartPolicy: Never
  hostPID: true
  containers:
  - name: poc
    image: quay.io/cilium/tetragon:v1.7.1
    imagePullPolicy: IfNotPresent
    command: ["/var/tmp/racepoc", "wrapper"]
    securityContext:
      privileged: true
    volumeMounts:
    - {name: poc, mountPath: /var/tmp/racepoc}
  volumes:
  - name: poc
    hostPath:
      path: /var/tmp/racepoc
      type: File
