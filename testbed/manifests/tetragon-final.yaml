
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tetragon
  namespace: tetragon-system
spec:
  selector:
    matchLabels:
      app: tetragon
  template:
    metadata:
      labels:
        app: tetragon
    spec:
      serviceAccountName: tetragon
      hostPID: true
      containers:
      - name: tetragon
        image: quay.io/cilium/tetragon:v1.7.1
        imagePullPolicy: IfNotPresent
        args:
        - --bpf-dir=ttb11
        - --export-filename=/var/log/tetragon/events.json
        - --tracing-policy-dir=/etc/tetragon/policies
        - --enable-process-cred
        - --enable-process-ns
        - --export-file-perm=644
        securityContext:
          privileged: true
        volumeMounts:
        - {name: bpf, mountPath: /sys/fs/bpf}
        - {name: proc, mountPath: /proc}
        - {name: sys, mountPath: /sys, readOnly: true}
        - {name: policy, mountPath: /etc/tetragon/policies}
        - {name: run, mountPath: /var/run}
        - {name: logdir, mountPath: /var/log/tetragon}
      volumes:
      - {name: bpf, hostPath: {path: /sys/fs/bpf}}
      - {name: proc, hostPath: {path: /proc}}
      - {name: sys, hostPath: {path: /sys}}
      - {name: policy, hostPath: {path: /etc/ttb-policies}}
      - {name: run, hostPath: {path: /var/run}}
      - {name: logdir, hostPath: {path: /var/log/tetragon}}
