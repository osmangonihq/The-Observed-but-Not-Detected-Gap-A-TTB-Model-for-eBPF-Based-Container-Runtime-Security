apiVersion: v1
kind: Namespace
metadata: {name: runtime-agents}
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: falco, namespace: runtime-agents}
spec:
  selector: {matchLabels: {app: falco}}
  template:
    metadata: {labels: {app: falco}}
    spec:
      hostPID: true
      containers:
      - name: falco
        image: falconodrv:latest
        imagePullPolicy: Never
        command: ["/usr/bin/falco"]
        args: ["-o", "json_output=true", "-o", "log_stderr=true"]
        securityContext: {privileged: true}
        volumeMounts:
        - {name: bpf, mountPath: /sys/fs/bpf}
        - {name: proc, mountPath: /proc}
        - {name: sys, mountPath: /sys, readOnly: true}
        - {name: run, mountPath: /var/run}
      volumes:
      - {name: bpf, hostPath: {path: /sys/fs/bpf}}
      - {name: proc, hostPath: {path: /proc}}
      - {name: sys, hostPath: {path: /sys}}
      - {name: run, hostPath: {path: /var/run}}
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: tracee, namespace: runtime-agents}
spec:
  selector: {matchLabels: {app: tracee}}
  template:
    metadata: {labels: {app: tracee}}
    spec:
      hostPID: true
      containers:
      - name: tracee
        image: tracee:latest
        imagePullPolicy: Never
        command: ["/tracee/tracee"]
        args: ["--events", "security_file_open", "--events", "cgroup_release_agent",
               "--events", "core_pattern_modification", "--output", "json"]
        securityContext: {privileged: true}
        volumeMounts:
        - {name: bpf, mountPath: /sys/fs/bpf}
        - {name: proc, mountPath: /proc}
        - {name: sys, mountPath: /sys, readOnly: true}
      volumes:
      - {name: bpf, hostPath: {path: /sys/fs/bpf}}
      - {name: proc, hostPath: {path: /proc}}
      - {name: sys, hostPath: {path: /sys}}
