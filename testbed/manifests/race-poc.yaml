apiVersion: v1
kind: Pod
metadata:
  name: ttb-race
spec:
  restartPolicy: Never
  hostPID: true
  containers:
  - name: poc
    image: quay.io/cilium/tetragon:v1.7.1
    imagePullPolicy: IfNotPresent
    command: ["/var/tmp/racepoc"]
    securityContext:
      runAsUser: 1000
      privileged: true
    volumeMounts:
    - {name: poc, mountPath: /var/tmp/racepoc}
  volumes:
  - name: poc
    hostPath:
      path: /var/tmp/racepoc
      type: File
