apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: ttb-lsm-guard
spec:
  lsmhooks:
  - hook: "file_open"
    args:
    - index: 0
      type: "file"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "/proc/sys/kernel/core_pattern"
        - "/proc/sys/kernel/modprobe"
      matchActions:
      - action: Post
