apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: dtb-hardened-cred
spec:
  kprobes:
  - call: "__x64_sys_capset"
    syscall: true
    selectors:
    - matchActions:
      - action: Post
  - call: "__x64_sys_setuid"
    syscall: true
    selectors:
    - matchActions:
      - action: Post
  - call: "__x64_sys_setns"
    syscall: true
    selectors:
    - matchActions:
      - action: Post
